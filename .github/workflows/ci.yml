name: CI

on:
  push: { branches: [main] }
  pull_request:

env:
  DOTNET_NOLOGO: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  CI: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      # 1. Restore in locked mode. A lock file mismatch fails the build rather
      #    than silently resolving a different version than the developer had.
      - name: Restore
        run: dotnet restore --locked-mode

      # 2. Build. Warnings are errors (Directory.Build.props).
      - name: Build
        run: dotnet build --no-restore --configuration Release

      # 3. Architecture tests run BEFORE unit tests: fastest stage, and it catches
      #    the most common class of pull request mistake.
      - name: Architecture tests
        run: dotnet test tests/POS.ArchitectureTests --no-build --configuration Release --logger trx

      - name: Unit tests
        run: dotnet test tests/POS.UnitTests --no-build --configuration Release --logger trx

      # 5. Real SQL Server via Testcontainers. Slower than an in-memory provider,
      #    and the difference between tests that mean something and tests that don't.
      - name: Integration tests
        run: dotnet test tests/POS.IntegrationTests --no-build --configuration Release --logger trx

      # 6. Licence audit. Given MediatR, AutoMapper, MassTransit and
      #    FluentAssertions all changed terms within eighteen months, an
      #    automated check is table stakes rather than paranoia.
      #    license-url-mappings.json exists because some packages declare their licence as a bare
      #    URL rather than an SPDX expression, and the tool cannot resolve those on its own — it
      #    reports "Cannot determine License type for url ..." and fails. That is the gate working:
      #    an unreadable licence is not an approved one. Each entry records what the URL actually
      #    points at (xUnit is Apache-2.0, SSH.NET is MIT, the aspnet/2.0.0 file is Apache-2.0)
      #    rather than widening licenses.json, so a genuinely unknown licence still fails.
      #
      #    license-ignored-packages.json lists 49 Microsoft framework packages from the .NET Core
      #    1.x era (System.*, Microsoft.NETCore.*, the runtime.*-native OpenSsl set, and
      #    Microsoft.Data.SqlClient.SNI.runtime). They all carry the Microsoft .NET Library EULA
      #    at http://go.microsoft.com/fwlink/?LinkId=329770, which has no SPDX identifier —
      #    --allowed-license-types matches SPDX ids, so there is no string that can express it and
      #    adding "Microsoft Software License" to licenses.json does nothing.
      #
      #    They are ignored by exact name rather than by pattern, and -t is kept, so every other
      #    transitive package is still audited and any NEW package with an unrecognised licence
      #    still fails. Verified: removing Apache-2.0 from licenses.json turns the step red again
      #    (48 failures), so the gate is still doing its job.
      #
      #    Most of these are not in the resolved dependency graph at all — dotnet list package
      #    --include-transitive shows only SNI.runtime. nuget-license walks declared nuspec
      #    dependencies, so it sees packages the build never restores.
      - name: Licence audit
        run: |
          dotnet tool install --global nuget-license
          nuget-license -i POS.sln -t \
            --allowed-license-types licenses.json \
            --licenseurl-to-license-mappings license-url-mappings.json \
            --override-package-information license-overrides.json \
            --ignored-packages license-ignored-packages.json

      # Detects the *presence* of a finding rather than the absence of a
      # reassuring string. The earlier `grep -q "no vulnerable packages" || exit 1`
      # looked stricter than it was: across a multi-project solution the output
      # carries one line per project, so a single clean project ("...has no
      # vulnerable packages") satisfied the grep and passed the build even when
      # another project reported "has the following vulnerable packages" right
      # below it. Note `dotnet list package --vulnerable` exits 0 either way, so
      # inspecting the output is the only option here.
      - name: Vulnerability scan
        run: |
          dotnet list package --vulnerable --include-transitive 2>&1 | tee vuln.log
          if grep -q "has the following vulnerable packages" vuln.log; then
            echo "::error::Vulnerable NuGet packages found (see the table above)."
            exit 1
          fi
          echo "No vulnerable packages found."

      - name: Publish test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: '**/*.trx'

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: src/Frontend/POS.BackOffice

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: src/Frontend/POS.BackOffice/package-lock.json

      # Locked install: a lock file mismatch fails the build rather than
      # silently resolving a different dependency tree than the developer had.
      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Audit
        run: npm audit --audit-level=high
