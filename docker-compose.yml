name: pos

# Local development environment.
# Target: git clone -> docker compose up -> working API, under ten minutes on a
# clean machine. If onboarding takes a day, the environment is broken.

services:

  # The API itself. Built from src/Hosts/POS.Api/Dockerfile, wired to every other
  # service in this file by its Docker-network hostname rather than localhost —
  # localhost inside this container is the container itself, not the host machine.
  api:
    build:
      context: .
      dockerfile: src/Hosts/POS.Api/Dockerfile
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Pos: "Server=sqlserver;Database=PosPlatform;User Id=sa;Password=${MSSQL_SA_PASSWORD:-Local_Dev_Password_1};TrustServerCertificate=true;Encrypt=false"
      ConnectionStrings__Redis: "redis:6379"
      Identity__SigningKey: "${IDENTITY_SIGNING_KEY:-dev-only-signing-key-change-me-32b!}"
      Provisioning__Enabled: "true"
      Provisioning__RootApiKey: "${PROVISIONING_ROOT_KEY:-dev-only-root-key-change-me}"
      Api__EnableOpenApiDocs: "true"
      # AddOtlpExporter() with no explicit endpoint reads this env var; unset, it
      # defaults to localhost:4317, which inside this container is itself, not the
      # jaeger service.
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://jaeger:4317"
    depends_on:
      sqlserver:
        condition: service_healthy
      redis:
        condition: service_healthy

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD:-Local_Dev_Password_1}"
      MSSQL_PID: Developer
    ports:
      - "1433:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # Structured log viewing. Serilog writes here in development.
  seq:
    image: datalust/seq:latest
    environment:
      ACCEPT_EULA: "Y"
    ports:
      - "5341:80"
    volumes:
      - seq-data:/data

  # Trace visualisation. OTLP receiver on 4317.
  jaeger:
    image: jaegertracing/all-in-one:latest
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"   # UI
      - "4317:4317"     # OTLP gRPC

  # Email capture. Not used until Phase 11, but cheap to have present so nobody
  # has to touch this file again to add it.
  mailhog:
    image: mailhog/mailhog:latest
    ports:
      - "8025:8025"     # UI
      - "1025:1025"     # SMTP

volumes:
  sqlserver-data:
  redis-data:
  seq-data:
